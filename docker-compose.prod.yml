version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrocloud-db-prod
    environment:
      POSTGRES_DB: agrocloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - agrocloud-network-prod
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrocloud-redis-prod
    networks:
      - agrocloud-network-prod
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrocloud-backend-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agrocloud
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agrocloud-network-prod
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: agrocloud-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - agrocloud-network-prod
    restart: always

volumes:
  postgres_data_prod:


networks:
  agrocloud-network-prod:
    driver: bridge
