<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Simple plant sprout logo -->
  <!-- Stem -->
  <path d="M 50 90 L 50 40" stroke="#22c55e" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Left leaf -->
  <path d="M 50 55 Q 30 50 25 45 Q 30 50 50 52" fill="#22c55e"/>
  
  <!-- Right leaf -->
  <path d="M 50 55 Q 70 50 75 45 Q 70 50 50 52" fill="#22c55e"/>
  
  <!-- Top left leaf -->
  <path d="M 50 45 Q 35 42 30 35 Q 35 40 50 43" fill="#10b981"/>
  
  <!-- Top right leaf -->
  <path d="M 50 45 Q 65 42 70 35 Q 65 40 50 43" fill="#10b981"/>
  
  <!-- Ground line -->
  <line x1="35" y1="90" x2="65" y2="90" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
</svg>
