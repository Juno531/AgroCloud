version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agrocloud-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrocloud}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agrocloud-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrocloud-redis
    ports:
      - "6379:6379"
    networks:
      - agrocloud-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agrocloud-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@agrocloud.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - agrocloud-network
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrocloud-backend
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agrocloud}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Asia/Seoul
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-super@sp.sp}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-1234}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-"슈퍼 어드민"}

      # API Security Keys (Must provide via .env)
      JWT_SECRET: ${JWT_SECRET:-agrocloud-secret-key-change-this-in-production-must-be-at-least-256-bits-long}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-ADMIN123}
      FARM_INVITE_CODE: ${FARM_INVITE_CODE:-FARM123}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agrocloud-network
    restart: unless-stopped

volumes:
  postgres_data:


networks:
  agrocloud-network:
    driver: bridge
