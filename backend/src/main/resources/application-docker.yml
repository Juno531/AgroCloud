spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/agrocloud
    username: postgres
    password: postgres

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    enabled: false
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: update  # Auto-create/update schema in Docker environment

logging:
  level:
    root: INFO
    com.farm.erp: INFO
    org.hibernate.SQL: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

management:
  health:
    mail:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: true
    db:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  invite-codes:
    admin: ${ADMIN_INVITE_CODE:ADMIN123}
    farm: ${FARM_INVITE_CODE:FARM123}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:super@agro.com}
    password: ${SUPER_ADMIN_PASSWORD:1234}
    name: ${SUPER_ADMIN_NAME:Super Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*}
