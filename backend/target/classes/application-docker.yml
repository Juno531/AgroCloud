spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/farm_erp
    username: postgres
    password: postgres

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:9092

  jpa:
    hibernate:
      ddl-auto: update  # Auto-create/update schema in Docker environment

logging:
  level:
    root: INFO
    com.farm.erp: INFO
    org.hibernate.SQL: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
