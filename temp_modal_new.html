<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Farm ERP - Create New Task</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Manrope', sans-serif;
            }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #dbe6db;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen overflow-hidden">
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<div class="bg-white dark:bg-slate-950 w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden border border-slate-200 dark:border-slate-800">
<div class="px-8 py-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="size-12 text-primary bg-primary/10 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">add_task</span>
</div>
<div>
<h2 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Create New Task</h2>
<p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Simplified Task Entry</p>
</div>
</div>
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-900 rounded-xl transition-colors">
<span class="material-symbols-outlined text-slate-400">close</span>
</button>
</div>
<div class="flex-1 overflow-y-auto custom-scrollbar p-8">
<form class="space-y-6">
<div class="space-y-2">
<label class="text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wider ml-1">Task Name</label>
<input class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all font-semibold text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="e.g., Harvesting Romaine Lettuce" type="text"/>
</div>
<div class="space-y-2">
<label class="text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wider ml-1">Task Keywords</label>
<div class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-800 rounded-2xl p-2 focus-within:ring-4 focus-within:ring-primary/10 focus-within:border-primary transition-all">
<div class="flex flex-wrap gap-2 items-center min-h-[48px]">
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300 text-xs font-bold rounded-xl border border-green-200 dark:border-green-800">
                                Harvesting
                                <button class="hover:text-green-900" type="button"><span class="material-symbols-outlined text-sm">close</span></button>
</span>
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-xs font-bold rounded-xl border border-blue-200 dark:border-blue-800">
                                Irrigation
                                <button class="hover:text-blue-900" type="button"><span class="material-symbols-outlined text-sm">close</span></button>
</span>
<span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-orange-100 dark:bg-orange-900/40 text-orange-700 dark:text-orange-300 text-xs font-bold rounded-xl border border-orange-200 dark:border-orange-800">
                                Pest Control
                                <button class="hover:text-orange-900" type="button"><span class="material-symbols-outlined text-sm">close</span></button>
</span>
<input class="flex-1 min-w-[120px] bg-transparent border-none focus:ring-0 p-1 text-sm font-semibold text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="Type to add keywords..." type="text"/>
</div>
</div>
<div class="flex gap-2 mt-2 ml-1">
<span class="text-[10px] font-bold text-slate-400 uppercase tracking-tight">Suggestions:</span>
<button class="text-[10px] font-bold text-primary hover:underline uppercase tracking-tight" type="button">Pruning</button>
<button class="text-[10px] font-bold text-primary hover:underline uppercase tracking-tight" type="button">Fertilizing</button>
<button class="text-[10px] font-bold text-primary hover:underline uppercase tracking-tight" type="button">Equipment Maintenance</button>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wider ml-1">Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">calendar_today</span>
<input class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-800 rounded-2xl pl-12 pr-5 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all font-semibold text-slate-900 dark:text-white" type="date" value="2024-11-14"/>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wider ml-1">Manager</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">account_circle</span>
<select class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-800 rounded-2xl pl-12 pr-10 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all font-semibold text-slate-900 dark:text-white appearance-none">
<option disabled="" selected="" value="">Select Manager</option>
<option>John Smith</option>
<option>Sarah Chen</option>
<option>Mike Ross</option>
<option>Elena Rodriguez</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-black text-slate-700 dark:text-slate-300 uppercase tracking-wider ml-1">Description</label>
<textarea class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-100 dark:border-slate-800 rounded-2xl px-5 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all font-semibold text-slate-900 dark:text-white placeholder:text-slate-400 resize-none" placeholder="Detail the task requirements, specific blocks, or equipment needed..." rows="4"></textarea>
</div>
</form>
</div>
<div class="px-8 py-6 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/30 flex items-center justify-end gap-4">
<button class="px-8 py-4 text-slate-600 dark:text-slate-400 font-black hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all uppercase tracking-widest text-xs">
                Cancel
            </button>
<button class="px-10 py-4 bg-primary text-white font-black rounded-2xl shadow-xl shadow-primary/30 hover:scale-[1.02] active:scale-95 transition-all uppercase tracking-widest text-xs flex items-center gap-2">
<span class="material-symbols-outlined text-xl">save</span>
                Save Task
            </button>
</div>
</div>
</div>
<div class="flex h-screen w-full overflow-hidden filter blur-sm">
<aside class="w-64 bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0 z-20">
<div class="p-6">
<div class="flex items-center gap-3">
<div class="size-10 text-primary bg-primary/10 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">eco</span>
</div>
<div class="flex flex-col">
<h2 class="text-slate-900 dark:text-white text-lg font-extrabold leading-tight tracking-tight uppercase">Farm ERP</h2>
<span class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Cloud-Leaf Management</span>
</div>
</div>
</div>
<nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
<a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 hover:text-primary transition-all group" href="#">
<span class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">dashboard</span>
<span>Dashboard</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 transition-all" href="#">
<span class="material-symbols-outlined text-2xl">task_alt</span>
<span>Tasks</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 font-bold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900 hover:text-primary transition-all group" href="#">
<span class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform">potted_plant</span>
<span>Crops</span>
</a>
</nav>
<div class="p-4 border-t border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-900 rounded-2xl">
<div class="size-10 rounded-full bg-primary/20 border-2 border-primary overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArssEDeEYvoNpcSCg76UWNp6QTont9JUreJNoN2Fm35jdAJI0q7ixKWzZoc7_v67vqvZ46F7bdjj_IR6u3uk6FvllGAx82cBdbUTRvlG01ZY_aRLhosIJmE558CXJTUJusKPDWTy03ejb6oIVStl_x85KNQPDZf1wEpAZDsrfEpd3q1XhZkav8QQ3BxVvhZ7efrFF-H3FDAbGTtBok4c7vRkONXzWJV46pYlXOZKS7Gke7YBkXH4tndjt1z4NGqtvXNdIzEeo1jq8"/>
</div>
<div class="flex flex-col min-w-0">
<span class="text-sm font-bold text-slate-900 dark:text-white truncate">John Doe</span>
<span class="text-[10px] text-slate-500 font-semibold truncate">Admin Account</span>
</div>
<button class="ml-auto text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
</aside>
<div class="flex-1 flex flex-col min-w-0">
<header class="h-16 flex items-center justify-between px-8 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shrink-0 z-10">
<h1 class="text-xl font-bold text-slate-800 dark:text-white">Task Management</h1>
</header>
<div class="flex-1 flex overflow-hidden">
<aside class="w-32 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col shrink-0">
<div class="flex-1 overflow-y-auto px-4 flex flex-col gap-3 py-4">
<button class="w-full py-4 rounded-2xl flex flex-col items-center gap-1 bg-primary text-white shadow-lg shadow-primary/30 ring-4 ring-primary/10 scale-105 z-10">
<span class="text-[10px] font-bold opacity-80 uppercase">Wed</span>
<span class="text-xl font-black">14</span>
</button>
</div>
</aside>
<main class="flex-1 bg-background-light dark:bg-background-dark overflow-y-auto p-8">
<div class="max-w-5xl mx-auto">
<div class="flex flex-wrap items-center justify-between gap-6 mb-8">
<h2 class="text-4xl font-black text-slate-900 dark:text-white tracking-tight">Wednesday, Nov 14</h2>
<button class="flex items-center gap-2 px-8 py-4 bg-primary text-white font-black rounded-2xl shadow-xl shadow-primary/30">
<span class="material-symbols-outlined">add</span>
<span>Create New Task</span>
</button>
</div>
</div>
</main>
</div>
</div>
</div>

</body></html>
