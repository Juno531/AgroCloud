server {
    listen ${PORT};
    server_name localhost;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api {
        # Using a variable forces Nginx to resolve the hostname at runtime, preventing startup crashes.
        # Docker's internal DNS is 127.0.0.111. Public DNS as fallback. valid=30s caches resolutions.
        resolver 127.0.0.11 8.8.8.8 valid=30s;
        
        # Railway automatically passes the BACKEND_URL.
        set $backend_upstream "${BACKEND_URL}";
        
        # Rewrite the URL so `/api/v1/auth/login` stays the same when passed to the backend,
        # unless the BACKEND_URL already includes a path.
        proxy_pass $backend_upstream;
        
        proxy_set_header Host $proxy_host; # Let Nginx manage the host header for upstream
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
